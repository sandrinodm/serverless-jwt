overrides:
  # GHSA-g3hv-75wg-m249: audit-gated tooling transitive; eligible fix checked 2026-11-11.
  'minimatch@10.2.6': '11.0.4'
  # Stryker's tooling-only qs version has four fixed denial-of-service advisories.
  'qs@6.15.1': '6.16.1'
  # P4 CLI advisories: exact affected versions; evidence and reassessment in docs/development.md.
  'undici@5.28.4': '6.29.1'
  'undici@5.29.0': '6.29.1'
  'path-to-regexp@6.1.0': '6.3.0'
  'path-to-regexp@8.3.0': '8.4.2'
  'minimatch@10.1.1': '11.0.4'
  'ajv@8.6.3': '8.20.0'
  'smol-toml@1.5.2': '1.9.1'
  'tar@7.5.11': '7.5.22'
  'js-yaml@4.1.1': '4.3.2'
  '@fastify/busboy@2.1.1': '3.2.4'
  # Use the fixed v4 entry; /v3 retains the resource-amplification behavior.
  'zod@3.22.4': '4.6.7'
  'zod@4.1.11': '4.6.7'
  'glob@13.0.6': '14.0.3'
  # Testcontainers archive utilities use the same reviewed fixed glob sync API.
  'glob@10.5.0': '14.0.3'
  # Upstream 4.3.1 has no fixed release. The reviewed fork rejects prototype writes.
  # Reassess on either consumer change; remove when eligible upstream code passes the regression.
  '@netlify/config@25.6.1>deepmerge': 'npm:@stackline/deepmerge@1.1.0'
  '@sveltejs/vite-plugin-svelte@7.3.1>deepmerge': 'npm:@stackline/deepmerge@1.1.0'
  # Nuxt4/Nitro2's actual Rollup resolver is the third reviewed consumer (P5).
  '@rollup/plugin-node-resolve@16.0.3>deepmerge': 'npm:@stackline/deepmerge@1.1.0'
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny: [vite]
  allowedVersions:
    vite: '*'
allowBuilds:
  esbuild: true
  workerd: false
  # Nitro optional SSH/database transports are unused; never run their native setup.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Optional Vercel account credential FFI is unused by isolated account-free tests.
  koffi: false
  # Completion setup and optional Unix datagram logging are unnecessary in isolated CLI tests.
  netlify-cli: false
  unix-dgram: false
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

patchedDependencies:
  netlify-cli@27.16.2: patches/netlify-cli@27.16.2.patch
  '@react-router/serve@8.5.1': patches/@react-router__serve@8.5.1.patch
  '@solidjs/router@1.0.1': patches/@solidjs__router@1.0.1.patch
  h3@2.0.8: patches/h3@2.0.8.patch
