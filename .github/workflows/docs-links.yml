name: Weekly external documentation links
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-doc-links-${{ github.ref }}
  cancel-in-progress: true
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
        with:
          version: 12.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install integrity-checked link checker
        env:
          LYCHEE_INSTALL_DIR: ${{ runner.temp }}/lychee
        run: |
          bash scripts/lychee-install.sh
          echo "LYCHEE_BIN=$LYCHEE_INSTALL_DIR/lychee-x86_64-unknown-linux-gnu/lychee" >> "$GITHUB_ENV"
      - run: pnpm docs:links --external
