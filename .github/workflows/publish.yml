name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        default: true
        description: Run all checks without registry writes
      resume-run-id:
        type: string
        required: false
        description: Reuse the exact artifacts from this publish run
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  build:
    if: inputs.resume-run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Verify current tag and successful master push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-verify.ts
      - name: Check stable promotion against the approved candidate
        if: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          APPROVED_RC_COMMIT: ${{ vars.APPROVED_RC_COMMIT }}
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; assert.match(process.env.APPROVED_RC_COMMIT ?? '', /^[a-f0-9]{40}$/, 'Stable publication requires the exact approved RC commit');"
          node scripts/release-diff.mjs "$APPROVED_RC_COMMIT" "$GITHUB_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.0
        with:
          version: 12.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.0.0'
          package-manager-cache: false
      - run: echo "MIN_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/jwt-verifier exec vp pack
      - run: pnpm build
      - run: pnpm build:apps
      - run: pnpm ready
      - run: pnpm test:release
      - run: pnpm --dir packages/jwt-verifier exec vp pack
      - run: pnpm build
      - run: pnpm pack:public "$RUNNER_TEMP/packages"
      - name: Install exact eligible runtime hosts
        working-directory: ${{ runner.temp }}
        run: |
          node "$GITHUB_WORKSPACE/node_modules/npm/bin/npm-cli.js" install --prefix "$RUNNER_TEMP/runtime-tools" --ignore-scripts --no-audit --no-fund --before="$(date -u -d '7 days ago' +%FT%TZ)" @deno/linux-x64-glibc@2.9.6 @oven/bun-linux-x64@1.4.4
          echo "DENO_BIN=$RUNNER_TEMP/runtime-tools/node_modules/@deno/linux-x64-glibc/deno" >> "$GITHUB_ENV"
          echo "BUN_BIN=$RUNNER_TEMP/runtime-tools/node_modules/@oven/bun-linux-x64/bin/bun" >> "$GITHUB_ENV"
      - run: pnpm test:package "$RUNNER_TEMP/packages"
      - name: Exact-artifact HTTP suite (P6 contract)
        run: pnpm test:e2e:release "$RUNNER_TEMP/packages"
      - name: Record tested tarball checksums
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/packages
        run: node scripts/release-checksums.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: ${{ runner.temp }}/packages
          retention-days: 90
          if-no-files-found: error

  authorize:
    needs: build
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.resume-run-id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.verify.outputs.artifact-id }}
      artifact-digest: ${{ steps.verify.outputs.artifact-digest }}
      source-run-id: ${{ steps.verify.outputs.source-run-id }}
      source-event: ${{ steps.verify.outputs.source-event }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Check stable promotion against the approved candidate
        if: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          APPROVED_RC_COMMIT: ${{ vars.APPROVED_RC_COMMIT }}
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; assert.match(process.env.APPROVED_RC_COMMIT ?? '', /^[a-f0-9]{40}$/, 'Stable publication requires the exact approved RC commit');"
          node scripts/release-diff.mjs "$APPROVED_RC_COMMIT" "$GITHUB_SHA"
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume-run-id }}
        run: node scripts/release-authorize.ts

  publish:
    needs: authorize
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Install exact eligible npm outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          node "$GITHUB_WORKSPACE/scripts/release-npm.ts"
          echo "$RUNNER_TEMP/npm-cli" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.authorize.outputs.artifact-id }}
          run-id: ${{ needs.authorize.outputs.source-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify authorized archive before extraction and each tested tarball
        env:
          ARTIFACT_DIGEST: ${{ needs.authorize.outputs.artifact-digest }}
        run: node scripts/release-artifact-check.ts "$RUNNER_TEMP/download" "$RUNNER_TEMP/packages"
      - name: Dry-run without registry writes
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/scripts/publish-all.ts" "$RUNNER_TEMP/packages" --dry-run
      - name: Publish exact tarballs through trusted publishing
        if: github.event_name == 'release' || !inputs.dry-run
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/scripts/publish-all.ts" "$RUNNER_TEMP/packages" --publish
      - name: Verify registry provenance and cryptographic signatures
        if: github.event_name == 'release' || !inputs.dry-run
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/scripts/verify-published.ts" "$RUNNER_TEMP/packages"
      - name: Reconcile exact tested bytes on the release
        if: github.event_name == 'release' || (!inputs.dry-run && inputs.resume-run-id != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_EVENT: ${{ needs.authorize.outputs.source-event }}
        run: node scripts/release-attach.ts "$RUNNER_TEMP/packages"
